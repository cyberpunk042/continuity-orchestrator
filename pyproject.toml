[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuity-orchestrator"
version = "0.1.0"
description = "A policy-first automation system for scheduled continuity operations"
license = "MIT"
requires-python = ">=3.11"

# Tier 0: Core — minimum viable tick
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.0",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",
    "jinja2>=3.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
# Tier 1: Per-adapter dependencies (lazy-installable in production)
adapters-email = ["resend>=1.0"]
adapters-sms = ["twilio>=8.0"]
adapters-reddit = ["praw>=7.0"]

# Tier 2: Feature modules (lazy-installable in production)
crypto = ["cryptography>=42.0"]
admin = [
    "flask>=3.0",
    "Pillow>=10.0",
]

# Convenience groups
adapters = [
    "resend>=1.0",
    "twilio>=8.0",
    "praw>=7.0",
]
all = [
    "resend>=1.0",
    "twilio>=8.0",
    "praw>=7.0",
    "cryptography>=42.0",
    "flask>=3.0",
    "Pillow>=10.0",
]
dev = [
    "resend>=1.0",
    "twilio>=8.0",
    "praw>=7.0",
    "cryptography>=42.0",
    "flask>=3.0",
    "Pillow>=10.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]


[project.scripts]
continuity = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP006/017/035/037/042/045 require Python 3.10+ at runtime (env is 3.8)
# E501 line-length is too noisy for now
ignore = ["UP006", "UP017", "UP035", "UP037", "UP042", "UP045", "E501", "E402", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Catch real bugs without requiring full annotations everywhere
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
